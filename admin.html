<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoroBadge Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }

    .container {
      max-width: 460px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 24px;
    }

    .brand {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo {
      display: block;
      margin: 0 auto;
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    .title-login {
      font-size: 30px;
      font-weight: 700;
      color: #1f2937;
      margin: 0;
    }

    .title-app {
      font-size: 40px;
      font-weight: 800;
      color: #111827;
      margin: 0;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      margin-top: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .btn-login {
      background: #2563eb;
    }

    .btn-refresh {
      background: #0f766e;
    }

    .btn-save-note {
      background: #7c3aed;
    }

    .btn-logout {
      background: #dc2626;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      white-space: pre-line;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    .user-box {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .admin-section-title {
      text-align: center;
      margin: 18px 0 12px;
      color: #1f2937;
      font-size: 20px;
    }

    .admin-employee-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      min-width: 14px;
      border-radius: 50%;
      margin-top: 5px;
    }

    .status-verde {
      background: #16a34a;
    }

    .status-rosso {
      background: #dc2626;
    }

    .status-arancione {
      background: #f59e0b;
    }

    .admin-employee-content {
      flex: 1;
    }

    .admin-employee-name {
      font-weight: bold;
      font-size: 16px;
      color: #111827;
    }

    .admin-employee-username {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }

    .admin-employee-status {
      font-size: 14px;
      margin-top: 6px;
      font-weight: bold;
    }

    .admin-employee-detail {
      font-size: 13px;
      color: #374151;
      margin-top: 4px;
    }

    .show-password-row {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .show-password-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: normal;
      white-space: nowrap;
    }

    .show-password-label input[type="checkbox"] {
      margin: 0;
      width: auto;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginView">
      <div class="brand">
        <img src="DoroMaris_logo.png" alt="Logo azienda" class="logo">
        <h1 class="title-login">DoroBadge Admin</h1>
      </div>

      <div class="subtitle">Accesso amministratori</div>

      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Inserisci username admin">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Inserisci password">

      <div class="show-password-row">
        <label class="show-password-label">
          <input type="checkbox" onchange="togglePasswordCheckbox(this)">
          <span>Mostra password</span>
        </label>
      </div>

      <button class="btn-login" onclick="loginAdmin()">Accedi</button>

      <div id="loginMessage" class="message hidden"></div>
    </div>

    <div id="adminView" class="hidden">
      <div class="brand">
        <img src="DoroMaris_logo.png" alt="Logo azienda" class="logo">
        <h2 class="title-app">DoroBadge Admin</h2>
      </div>

      <div class="user-box" id="adminUserBox"></div>

      <button class="btn-refresh" onclick="loadAdminDashboard()">Aggiorna riepilogo</button>

      <div id="adminMessage" class="message hidden"></div>

      <h3 class="admin-section-title">Dipendenti oggi</h3>
      <div id="adminEmployeesList"></div>

      <label for="adminSegnalazione">Segnalazioni admin</label>
      <textarea id="adminSegnalazione" placeholder="Scrivi qui eventuali note operative..."></textarea>

      <button class="btn-save-note" onclick="saveAdminSegnalazione()">Salva segnalazione</button>
      <button class="btn-logout" onclick="logoutAdmin()">Esci</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyeiRSOcAKAWiBh_OP1eAsQx_nMx0kKbSPjrRKpxvNPBUwl0AhWNNJC3PLiBfZYaqSU/exec";

    let currentAdmin = null;

    function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.className = `message ${type}`;
      el.textContent = text;
    }

    function hideMessage(elementId) {
      const el = document.getElementById(elementId);
      el.className = 'message hidden';
      el.textContent = '';
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function togglePasswordCheckbox(checkbox) {
      const passwordInput = document.getElementById('password');
      passwordInput.type = checkbox.checked ? 'text' : 'password';
    }

    function getSessionToken() {
      return localStorage.getItem('dorobadgeAdminSessionToken') || '';
    }

    function loginAdmin() {
      hideMessage('loginMessage');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showMessage('loginMessage', 'Inserisci username e password.', 'error');
        return;
      }

      showMessage('loginMessage', 'Accesso in corso...', 'info');

      fetch(BACKEND_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'login',
          username: username,
          password: password
        })
      })
      .then(async response => {
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error('Risposta server non valida: ' + text);
        }
      })
      .then(data => {
        if (!data.success) {
          showMessage('loginMessage', data.message || 'Login fallito.', 'error');
          return;
        }

        if (!data.user || data.user.ruolo !== 'ADMIN') {
          showMessage('loginMessage', 'Accesso consentito solo agli amministratori.', 'error');
          return;
        }

        currentAdmin = data.user;
        localStorage.setItem('dorobadgeAdminUser', JSON.stringify(currentAdmin));
        localStorage.setItem('dorobadgeAdminSessionToken', data.sessionToken);

        showAdminView();
      })
      .catch(error => {
        console.error('LOGIN ADMIN ERROR:', error);
        showMessage('loginMessage', 'Errore di collegamento al server.', 'error');
      });
    }

    function showAdminView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('adminView').classList.remove('hidden');

      document.getElementById('adminUserBox').innerHTML = `
        <strong>Admin:</strong> ${escapeHtml(currentAdmin.nomeCompleto)}<br>
        <strong>Username:</strong> ${escapeHtml(currentAdmin.username)}<br>
        <strong>ID:</strong> ${escapeHtml(currentAdmin.idUtente)}<br>
        <strong>Ruolo:</strong> ${escapeHtml(currentAdmin.ruolo)}
      `;

      hideMessage('adminMessage');
      loadAdminDashboard();
    }

    function logoutAdmin() {
      currentAdmin = null;
      localStorage.removeItem('dorobadgeAdminUser');
      localStorage.removeItem('dorobadgeAdminSessionToken');

      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('password').value = '';
      document.getElementById('adminSegnalazione').value = '';
      hideMessage('adminMessage');
      showMessage('loginMessage', 'Logout effettuato.', 'info');
    }

    function forceLogoutWithMessage(message) {
      currentAdmin = null;
      localStorage.removeItem('dorobadgeAdminUser');
      localStorage.removeItem('dorobadgeAdminSessionToken');

      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('password').value = '';
      hideMessage('adminMessage');
      showMessage('loginMessage', message, 'error');
    }

    function loadAdminDashboard() {
      hideMessage('adminMessage');

      fetch(BACKEND_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'getAdminDashboard',
          sessionToken: getSessionToken()
        })
      })
      .then(async response => {
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error('Risposta server non valida: ' + text);
        }
      })
      .then(data => {
        if (!data.success) {
          if (
            data.message === 'Sessione scaduta' ||
            data.message === 'Sessione non valida' ||
            data.message === 'Sessione mancante' ||
            data.message === 'Sessione non attiva'
          ) {
            forceLogoutWithMessage('Sessione scaduta. Effettua di nuovo il login.');
            return;
          }

          showMessage('adminMessage', data.message || 'Errore caricamento dashboard admin.', 'error');
          return;
        }

        renderAdminEmployees(data.employees || []);
      })
      .catch(error => {
        console.error('ERRORE DASHBOARD ADMIN:', error);
        showMessage('adminMessage', `Errore caricamento dashboard admin.\nDettaglio: ${error.message}`, 'error');
      });
    }

    function renderAdminEmployees(employees) {
      const container = document.getElementById('adminEmployeesList');

      if (!employees || employees.length === 0) {
        container.innerHTML = `
          <div class="admin-employee-card">
            <div class="admin-employee-content">
              <div class="admin-employee-name">Nessun dipendente trovato</div>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = employees.map(emp => {
        let statusClass = 'status-rosso';

        if (emp.colore === 'verde') statusClass = 'status-verde';
        if (emp.colore === 'arancione') statusClass = 'status-arancione';

        return `
          <div class="admin-employee-card">
            <div class="status-dot ${statusClass}"></div>
            <div class="admin-employee-content">
              <div class="admin-employee-name">${escapeHtml(emp.nomeCompleto)}</div>
              <div class="admin-employee-username">@${escapeHtml(emp.username)}</div>
              <div class="admin-employee-status">${escapeHtml(emp.stato)}</div>
              <div class="admin-employee-detail">${escapeHtml(emp.dettaglio)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function saveAdminSegnalazione() {
      hideMessage('adminMessage');

      const textarea = document.getElementById('adminSegnalazione');
      const testoSegnalazione = textarea.value.trim();

      if (!testoSegnalazione) {
        showMessage('adminMessage', 'Scrivi una segnalazione prima di salvarla.', 'error');
        return;
      }

      fetch(BACKEND_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'saveAdminSegnalazione',
          sessionToken: getSessionToken(),
          testoSegnalazione: testoSegnalazione
        })
      })
      .then(async response => {
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error('Risposta server non valida: ' + text);
        }
      })
      .then(data => {
        if (!data.success) {
          if (
            data.message === 'Sessione scaduta' ||
            data.message === 'Sessione non valida' ||
            data.message === 'Sessione mancante' ||
            data.message === 'Sessione non attiva'
          ) {
            forceLogoutWithMessage('Sessione scaduta. Effettua di nuovo il login.');
            return;
          }

          showMessage('adminMessage', data.message || 'Errore salvataggio segnalazione admin.', 'error');
          return;
        }

        textarea.value = '';
        showMessage('adminMessage', 'Segnalazione admin salvata correttamente.', 'success');
      })
      .catch(error => {
        console.error('ERRORE SEGNALAZIONE ADMIN:', error);
        showMessage('adminMessage', `Errore salvataggio segnalazione admin.\nDettaglio: ${
